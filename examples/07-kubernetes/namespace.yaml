apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-app
  namespace: monitoring-lab
  labels:
    app: demo-app
spec:
  containers:
    - name: demo
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: monitoring-lab
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 80
